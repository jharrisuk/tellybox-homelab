name: Release source

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the tag matches the server version
        run: |
          node -e "const p=require('./server/package.json'); const tag=process.env.GITHUB_REF_NAME.replace(/^v/,''); if(p.version!==tag){console.error('Tag',tag,'does not match server',p.version); process.exit(1)}"
      - name: Install media test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Server tests
        working-directory: server
        run: npm ci && npm test
      - name: Build source assets
        run: |
          set -euo pipefail
          mkdir -p dist
          tar --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 \
            --numeric-owner --exclude=.git --exclude=dist \
            -czf "dist/tellybox-homelab-${GITHUB_REF_NAME#v}.tar.gz" .
          cp packaging/public-manifest.json dist/public-manifest.json
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish the source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Tellybox HomeLab $GITHUB_REF_NAME" \
            --notes-file docs/CHANGELOG.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
