name: Verify HomeLab server
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install media test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Server tests
        working-directory: server
        run: npm ci && npm test
      - name: Home Assistant parser and URL tests
        working-directory: integrations/home-assistant
        run: python3 -m unittest discover -s tests -v
      - name: Validate Compose and generated guide
        run: docker compose config --quiet && node docs/build-guide.mjs && git diff --exit-code -- docs/site
      - name: Build and check fresh installation
        run: docker compose -p homelab-ci up -d --build --wait && node packaging/check-container.mjs
      - name: Container diagnostics
        if: failure()
        run: docker compose -p homelab-ci logs --no-color --tail=100
      - name: Clean isolated test installation
        if: always()
        run: docker compose -p homelab-ci down -v
